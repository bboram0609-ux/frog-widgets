<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개구리 라디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#F6F8F3;--ink:#37352F;--sub:#66705F;--green:#2F6B45;--line:#DCE4D5;--chip:#FFFFFF;--font:'Jua',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--line:#38423A;--chip:#2A312B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--line:#38423A;--chip:#2A312B;color-scheme:dark}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top img{height:52px;width:auto;flex:none}
.name{font-size:17px;color:var(--green);margin-right:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--ink);font-family:var(--font);font-size:13px;cursor:pointer}
button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.player{flex:1 1 auto;min-height:120px;border-radius:8px;overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="top">
  <img src="frogs/dj.png" alt="DJ 개구리">
  <div class="name">개구리 라디오</div>
  <div class="chips" id="chips"></div>
</div>
<div class="player"><iframe id="yt" title="유튜브 음악" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<script>
// 주소 뒤에 ?yt=유튜브주소 를 붙이면 그 영상(또는 재생목록)이 '내 음악' 버튼으로 추가돼요
var stations=[
  {label:'카페 재즈',src:'https://www.youtube.com/embed/videoseries?list=PLqqys8u8qqZ7_b4_-6OkK-7rlFrbmAU_R'},
  {label:'재즈 라이브',src:'https://www.youtube.com/embed/live_stream?channel=UCJhjE7wbdYAae1G25m0tHAA'},
  {label:'로파이',src:'https://www.youtube.com/embed/live_stream?channel=UCSJ4gkVC6NrvII8umztf0Ow'}
];
var q=new URLSearchParams(location.search),mine=q.get('yt');
function toEmbed(u){
  try{var x=new URL(u);var list=x.searchParams.get('list');var id=x.hostname.indexOf('youtu.be')>-1?x.pathname.slice(1):x.searchParams.get('v');
    if(!id&&x.pathname.indexOf('/live/')===0)id=x.pathname.split('/')[2];
    if(id)return 'https://www.youtube.com/embed/'+id+(list?'?list='+list:'');
    if(list)return 'https://www.youtube.com/embed/videoseries?list='+list;}catch(e){}
  if(/^[\w-]{11}$/.test(u))return 'https://www.youtube.com/embed/'+u;
  return null;
}
if(mine&&toEmbed(mine))stations.unshift({label:'내 음악',src:toEmbed(mine)});
var start=0;try{var s=+localStorage.getItem('frog-radio');if(s>=0&&s<stations.length)start=s;}catch(e){}
var chips=document.getElementById('chips'),yt=document.getElementById('yt'),btns=[];
function pick(i){yt.src=stations[i].src;btns.forEach(function(b,j){b.setAttribute('aria-pressed',i===j?'true':'false')});try{localStorage.setItem('frog-radio',i)}catch(e){}}
stations.forEach(function(st,i){var b=document.createElement('button');b.type='button';b.textContent=st.label;b.onclick=function(){pick(i)};chips.appendChild(b);btns.push(b);});
pick(start);
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개구리 뽀모도로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#F6F8F3;--ink:#37352F;--sub:#66705F;--green:#2F6B45;--rest:#B4505A;--line:#DCE4D5;--btn:#FFFFFF;--mono:'Jua',system-ui,sans-serif;--sans:'Jua',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--rest:#EE9AA2;--line:#38423A;--btn:#2A312B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--rest:#EE9AA2;--line:#38423A;--btn:#2A312B;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px;box-sizing:border-box;overflow:hidden}
.ring{position:relative;width:min(72vh,150px);aspect-ratio:1;flex:none;max-width:45vw}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring img{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.mode{font-size:13px;font-weight:400}
.t{font-family:var(--mono);font-weight:400;font-size:clamp(30px,11vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
button{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--btn);color:var(--ink);font-family:var(--sans);font-size:14px;cursor:pointer}
button.main{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:400}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.cnt{font-size:12px;color:var(--sub)}
@media (max-width:280px){body{flex-direction:column;gap:6px;text-align:center}.btns{justify-content:center}.ring{width:40vh}}
</style>
</head>
<body>
<div class="ring">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="5"></circle><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"></circle></svg>
  <img id="frog" src="frogs/hp_star.png" alt="개구리">
</div>
<div class="side">
  <div class="mode" id="mode">집중 25분</div>
  <div class="t" id="t">25:00</div>
  <div class="btns">
    <button type="button" class="main" id="go">시작</button>
    <button type="button" id="reset">처음으로</button>
  </div>
  <div class="cnt" id="cnt">오늘 완료 0번</div>
</div>
<script>
var FOCUS=25*60,BREAK=5*60;
var mode='focus',left=FOCUS,running=false,endAt=0,timer=null,done=0;
var C=289,$=function(i){return document.getElementById(i)};
function total(){return mode==='focus'?FOCUS:BREAK}
function draw(){
  var m=Math.floor(left/60),s=left%60;
  $('t').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('arc').style.strokeDashoffset=C*(1-left/total());
  $('arc').style.stroke=mode==='focus'?'var(--green)':'var(--rest)';
  $('mode').textContent=mode==='focus'?'집중 25분':'쉬는 시간 5분';
  $('mode').style.color=mode==='focus'?'var(--green)':'var(--rest)';
  var img=!running&&left===total()&&mode==='focus'?'hp_star':mode==='focus'?(running?'hp_calm':'sleepy'):'melon';
  $('frog').src='frogs/'+img+'.png';
  $('go').textContent=running?'잠깐 멈춤':(left===total()?'시작':'계속');
  $('cnt').textContent='오늘 완료 '+done+'번';
}
function step(){
  left=Math.max(0,Math.round((endAt-Date.now())/1000));
  if(left===0){
    running=false;clearInterval(timer);
    if(mode==='focus'){done++;mode='break';$('frog').src='frogs/rockstar.png';}
    else{mode='focus';}
    left=total();draw();
    if(mode==='break')$('frog').src='frogs/rockstar.png';
    return;
  }
  draw();
}
$('go').onclick=function(){
  if(running){running=false;clearInterval(timer);draw();return;}
  running=true;endAt=Date.now()+left*1000;timer=setInterval(step,250);draw();
};
$('reset').onclick=function(){running=false;clearInterval(timer);mode='focus';left=FOCUS;draw();};
draw();
</script>
</body>
</html>

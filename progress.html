<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개구리 진행률</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#F6F8F3;--ink:#37352F;--sub:#66705F;--green:#2F6B45;--line:#DCE4D5;--mono:'Jua',system-ui,sans-serif;--sans:'Jua',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--line:#38423A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2420;--ink:#ECEFE8;--sub:#A9B3A2;--green:#8CC9A0;--line:#38423A;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;box-sizing:border-box;overflow:hidden}
.rows{display:grid;gap:min(9px,3vh);flex:1;max-width:280px;min-width:0}
.row{display:grid;grid-template-columns:minmax(40px,1fr) auto;align-items:center;gap:10px}
.bar{height:16px;border:2px solid var(--green);border-radius:5px;padding:2px;box-sizing:border-box}
.fill{height:100%;background:var(--green);border-radius:2px;width:0;transition:width .6s}
.lab{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
img{height:min(70vh,120px);width:auto;max-width:30vw;object-fit:contain;flex:none}
@media (max-width:300px){img{display:none}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="rows" id="rows"></div>
<img src="frogs/dj.png" alt="음악 트는 개구리">
<script>
var names=[['year','올해'],['month','이번 달'],['week','이번 주'],['day','오늘']];
var rows=document.getElementById('rows');
names.forEach(function(n){rows.insertAdjacentHTML('beforeend','<div class="row"><div class="bar"><div class="fill" id="f-'+n[0]+'"></div></div><span class="lab" id="l-'+n[0]+'"></span></div>')});
function pct(a,b,n){return Math.max(0,Math.min(1,(n-a)/(b-a)))}
function render(){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();
  var dow=(n.getDay()+6)%7, ws=new Date(y,m,d-dow);
  var v={
    year:pct(new Date(y,0,1),new Date(y+1,0,1),n),
    month:pct(new Date(y,m,1),new Date(y,m+1,1),n),
    week:pct(ws,new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7),n),
    day:pct(new Date(y,m,d),new Date(y,m,d+1),n)
  };
  names.forEach(function(k){
    var p=Math.floor(v[k[0]]*100);
    document.getElementById('f-'+k[0]).style.width=p+'%';
    document.getElementById('l-'+k[0]).textContent=k[1]+' '+p+'%';
  });
}
render();setInterval(render,60000);
</script>
</body>
</html>
